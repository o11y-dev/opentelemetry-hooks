name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Test OpenCode callback contracts
        run: bun test tests/opencode.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    needs: [lint, test, plugin-test, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test installed wheel outside checkout
        shell: pwsh
        run: |
          python -m pip install build
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venv = Join-Path $env:RUNNER_TEMP "hook environment-é"
          python -m venv $venv
          $python = Join-Path $venv "Scripts/python.exe"
          & $python -m pip install pytest (Get-Item dist/*.whl).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = Join-Path $env:RUNNER_TEMP "hook-wheel-tests"
          New-Item -ItemType Directory -Force $tests | Out-Null
          Copy-Item tests/test_parsers.py, tests/test_platform_support.py, tests/test_contracts.py $tests
          Copy-Item tests/fixtures $tests -Recurse
          $env:PATH = "$venv/Scripts;$env:PATH"
          Set-Location $tests
          & $python -m pytest -q --import-mode=importlib .
          exit $LASTEXITCODE
