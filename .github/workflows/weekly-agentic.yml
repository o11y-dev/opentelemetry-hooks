name: Weekly Agentic Code Improvement

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt build setuptools-scm

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m pytest tests/ -v

      - name: Build package
        id: build
        continue-on-error: true
        run: python -m build

      - name: Check outdated dependencies
        id: deps
        run: |
          pip list --outdated --format=json > outdated-deps.json
          python -c "import json, os; count = len(json.load(open('outdated-deps.json', 'r', encoding='utf-8'))); open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8').write(f'count={count}\\n')"

      - name: Create weekly improvement issue
        if: !cancelled()
        uses: actions/github-script@v7
        env:
          TEST_STATUS: ${{ steps.tests.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          OUTDATED_COUNT: ${{ steps.deps.outputs.count }}
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outdatedDeps = JSON.parse(fs.readFileSync('outdated-deps.json', 'utf8'));

            const title = `[Weekly Health] Code health report - ${new Date().toISOString().slice(0, 10)}`;
            const summary = [
              `## Weekly automated code health check`,
              `- Workflow run: ${runUrl}`,
              `- Tests: ${process.env.TEST_STATUS || 'not-run'}`,
              `- Build: ${process.env.BUILD_STATUS || 'not-run'}`,
              `- Outdated dependencies: ${process.env.OUTDATED_COUNT || '0'}`,
              ``,
              `## Suggested improvement actions`,
              `- [ ] Fix failing tests/build if any status is failure`,
              `- [ ] Review and safely upgrade outdated dependencies`,
              `- [ ] Add or refine tests for any changed behavior`,
            ];

            if (outdatedDeps.length > 0) {
              summary.push('', '### Outdated dependencies');
              for (const dep of outdatedDeps) {
                summary.push(`- ${dep.name}: ${dep.version} → ${dep.latest_version}`);
              }
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: summary.join('\n')
            });

      - name: Fail workflow when checks fail
        if: steps.tests.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
