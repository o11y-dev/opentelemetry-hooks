name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 1.2.0). Leave empty to auto-detect from conventional commits."
        required: false
        type: string
      force:
        description: "Force bump level when auto-detecting (leave empty for commit-based detection)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build setuptools-scm python-semantic-release

      - name: Determine version
        id: semver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be in semver format (e.g. 0.2.0), got: $VERSION"
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Manually specified version: $VERSION"
          else
            FORCE_ARG=""
            if [ -n "${{ inputs.force }}" ]; then
              FORCE_ARG="--${{ inputs.force }}"
            fi
            VERSION=$(semantic-release version --print $FORCE_ARG 2>/dev/null || true)
            if [ -z "$VERSION" ]; then
              echo "::notice::No version bump detected from commits. Use 'force' or provide an explicit 'version'."
            else
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "Auto-detected version: $VERSION"
            fi
          fi

      - name: Check tag does not already exist
        if: steps.semver.outputs.version != ''
        run: |
          if git rev-parse "v${{ steps.semver.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.semver.outputs.version }} already exists"
            exit 1
          fi

      - name: Create and push tag
        if: steps.semver.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.semver.outputs.version }}" -m "Release v${{ steps.semver.outputs.version }}"
          git push origin "v${{ steps.semver.outputs.version }}"

      - name: Build package
        if: steps.semver.outputs.version != ''
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.semver.outputs.version }}
        run: python -m build

      - name: Create GitHub Release
        if: steps.semver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          files: dist/*
          generate_release_notes: true
