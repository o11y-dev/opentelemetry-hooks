name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 1.2.0). Leave empty to auto-detect from conventional commits."
        required: false
        type: string
      force:
        description: "Force bump level when auto-detecting (leave empty for commit-based detection)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine python-semantic-release

      - name: Determine version
        id: semver
        run: |
          ARGS=()
          if [ -n "${{ inputs.version }}" ]; then
            ARGS+=(--version "${{ inputs.version }}")
          fi
          if [ -n "${{ inputs.force }}" ]; then
            ARGS+=(--force "${{ inputs.force }}")
          fi
          if [ "${#ARGS[@]}" -gt 0 ]; then
            VERSION=$(python3 scripts/release_workflow.py determine-version "${ARGS[@]}")
          else
            VERSION=$(python3 scripts/release_workflow.py determine-version)
          fi
          if [ -z "$VERSION" ]; then
            echo "::notice::No unreleased version found in pyproject.toml and no semantic-release bump was detected."
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Resolved release version: $VERSION"
          fi

      - name: Finalize release version
        id: release_meta
        if: steps.semver.outputs.version != ''
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          if git show-ref --tags --verify --quiet "refs/tags/v${VERSION}"; then
            echo "::notice::Tag v${VERSION} already exists; skipping release steps."
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in pyproject.toml, README.md, and CHANGELOG.md
        if: steps.release_meta.outputs.version != ''
        run: |
          python scripts/bump_version.py "${{ steps.release_meta.outputs.version }}"
          python scripts/update_readme_release_refs.py README.md "${{ steps.release_meta.outputs.version }}"
          if git diff --quiet; then
            echo "Files already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml README.md CHANGELOG.md
            git commit -m "release: v${{ steps.release_meta.outputs.version }}"
            git push origin HEAD
          fi

      - name: Build release notes
        if: steps.release_meta.outputs.version != ''
        run: python3 scripts/release_workflow.py release-notes "${{ steps.release_meta.outputs.version }}" > release-notes.md

      - name: Create and push tag
        if: steps.release_meta.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.release_meta.outputs.version }}" -m "Release v${{ steps.release_meta.outputs.version }}"
          git push origin "v${{ steps.release_meta.outputs.version }}"

      - name: Build package
        if: steps.release_meta.outputs.version != ''
        run: python -m build

      - name: Verify package
        if: steps.release_meta.outputs.version != ''
        run: twine check dist/*

      - name: Create GitHub Release
        if: steps.release_meta.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_meta.outputs.version }}
          files: dist/*
          body_path: release-notes.md

      - name: Delete merged branches
        if: steps.release_meta.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')
          gh api "repos/${{ github.repository }}/branches" --paginate -q '.[].name' | while read -r branch; do
            if [ "$branch" = "$DEFAULT_BRANCH" ]; then
              continue
            fi
            MERGED=$(gh api "repos/${{ github.repository }}/compare/${DEFAULT_BRANCH}...${branch}" -q '.status' 2>/dev/null || echo "error")
            if [ "$MERGED" = "behind" ] || [ "$MERGED" = "identical" ]; then
              echo "Deleting merged branch: $branch"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${branch}" 2>/dev/null || true
            fi
          done

  publish:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    environment: CD
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI }}
