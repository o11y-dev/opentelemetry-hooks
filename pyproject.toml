[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "opentelemetry-hooks"
dynamic = ["version"]
description = "OpenTelemetry integration for AI coding agents (Codex, Cursor IDE/CLI, GitHub Copilot, Claude Code, Antigravity, OpenCode-compatible runners)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["opentelemetry", "observability", "ai-agents", "codex", "claude", "copilot", "cursor", "gemini", "telemetry", "hooks", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
]
dependencies = [
    "click>=8.0",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.urls]
Homepage = "https://github.com/o11y-dev/opentelemetry-hooks"
Repository = "https://github.com/o11y-dev/opentelemetry-hooks"
Documentation = "https://github.com/o11y-dev/opentelemetry-hooks#readme"
Issues = "https://github.com/o11y-dev/opentelemetry-hooks/issues"

[project.scripts]
otel-hook = "otel_hook:cli"

[tool.setuptools]
py-modules = ["otel_hook", "enrichment_connectors"]

[tool.setuptools.data-files]
"share/opentelemetry-hooks" = ["otel_config.example.json"]
"share/opentelemetry-hooks/plugin" = ["plugin/opencode.ts"]
"share/opentelemetry-hooks/examples" = [
    "examples/antigravity-workflow.example.md",
    "examples/claude-hooks.example.json",
    "examples/codex-hooks.example.json",
    "examples/copilot-hooks.example.json",
    "examples/cursor-hooks.example.json",
    "examples/hooks.example.json",
]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.semantic_release]
version_toml = []
version_variables = []
major_on_zero = false
allow_zero_version = true
tag_format = "v{version}"
