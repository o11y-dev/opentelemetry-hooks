[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opentelemetry-hooks"
version = "0.15.0"
description = "OpenTelemetry integration for AI coding agents (Codex, Cursor IDE/CLI, GitHub Copilot, Claude Code, Gemini CLI, Antigravity, OpenCode-compatible runners)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
keywords = ["opentelemetry", "observability", "ai-agents", "codex", "claude", "copilot", "cursor", "gemini", "telemetry", "hooks", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
]
dependencies = [
    "click>=8.0",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.urls]
Homepage = "https://github.com/o11y-dev/opentelemetry-hooks"
Repository = "https://github.com/o11y-dev/opentelemetry-hooks"
Documentation = "https://github.com/o11y-dev/opentelemetry-hooks#readme"
Issues = "https://github.com/o11y-dev/opentelemetry-hooks/issues"
Changelog = "https://github.com/o11y-dev/opentelemetry-hooks/blob/main/CHANGELOG.md"

[project.scripts]
otel-hook = "otel_hooks.cli:run_cli"

[tool.setuptools]
py-modules = ["otel_hook", "enrichment_connectors"]

[tool.setuptools.packages.find]
include = ["otel_hooks*"]

[tool.setuptools.data-files]
"share/opentelemetry-hooks" = ["otel_config.example.json"]
"share/opentelemetry-hooks/plugin" = ["plugin/opencode.ts"]
"share/opentelemetry-hooks/examples" = [
    "examples/antigravity-workflow.example.md",
    "examples/claude-managed-settings.example.json",
    "examples/claude-hooks.example.json",
    "examples/codex-hooks.example.json",
    "examples/copilot-hooks.example.json",
    "examples/cursor-hooks.example.json",
    "examples/hooks.example.json",
    "examples/opencode-plugin.example.ts",
    "examples/otel_config.gateway.example.json",
    "examples/otel_config.reflect.example.json",
    "examples/otel_config.reflect.minimal.example.json",
]

"share/opentelemetry-hooks/examples/capture" = [
    "examples/capture/cursor.example.json",
    "examples/capture/claude.example.json",
    "examples/capture/codex.example.json",
    "examples/capture/gemini.example.json",
    "examples/capture/windsurf.example.json",
    "examples/capture/copilot.example.json",
    "examples/capture/opencode.example.json",
    "examples/capture/antigravity.example.json",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = []
major_on_zero = false
allow_zero_version = true
tag_format = "v{version}"
