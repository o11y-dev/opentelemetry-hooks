[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "opentelemetry-hooks"
dynamic = ["version"]
description = "OpenTelemetry integration for AI coding agents (Cursor IDE/CLI, GitHub Copilot, Claude Code, Antigravity, OpenCode-compatible runners)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.urls]
Homepage = "https://github.com/o11y-dev/opentelemetry-hooks"

[project.scripts]
otel-hook = "otel_hook:main"

[tool.setuptools]
py-modules = ["otel_hook"]

[tool.setuptools.data-files]
"share/opentelemetry-hooks" = ["otel_config.example.json"]
"share/opentelemetry-hooks/examples" = [
    "examples/antigravity-workflow.example.md",
    "examples/claude-hooks.example.json",
    "examples/copilot-hooks.example.json",
    "examples/cursor-hooks.example.json",
    "examples/hooks.example.json",
]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.semantic_release]
version_toml = []
version_variables = []
major_on_zero = false
allow_zero_version = true
tag_format = "v{version}"
