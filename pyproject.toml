[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opentelemetry-hooks"
version = "0.1.0"
description = "OpenTelemetry integration for AI coding agents (Cursor IDE, GitHub Copilot)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.urls]
Homepage = "https://github.com/o11y-dev/opentelemetry-hooks"

[tool.setuptools]
py-modules = ["otel_hook"]
