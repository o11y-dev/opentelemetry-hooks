[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentelemetry-hooks"
version = "0.1.0"
description = "OpenTelemetry integration for AI coding agents (Cursor IDE and GitHub Copilot)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.scripts]
otel-hook = "otel_hook:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
