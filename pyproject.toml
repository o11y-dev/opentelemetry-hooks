[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "opentelemetry-hooks"
dynamic = ["version"]
description = "OpenTelemetry integration for AI coding agents (Cursor IDE, GitHub Copilot, Claude Code, Antigravity)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.urls]
Homepage = "https://github.com/o11y-dev/opentelemetry-hooks"

[tool.setuptools]
py-modules = ["otel_hook"]

[tool.setuptools.data-files]
"share/opentelemetry-hooks" = ["otel_config.example.json"]
"share/opentelemetry-hooks/examples" = [
    "examples/claude-hooks.example.json",
    "examples/copilot-hooks.example.json",
    "examples/cursor-hooks.example.json",
    "examples/hooks.example.json",
]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.semantic_release]
version_toml = []
version_variables = []
major_on_zero = false
allow_zero_version = true
tag_format = "v{version}"
